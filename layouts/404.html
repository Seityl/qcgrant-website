{{ define "main" }}
<main class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">
  <div class="container text-center">
    <div class="row">
      <div class="col-lg-6 mx-auto">
        <h1 class="display-1 fw-bold">404</h1>
        <h2 class="mb-4">Page Not Found!</h2>
        <p class="lead mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="{{ site.BaseURL | relLangURL }}" class="btn btn-primary btn-lg">Back To Home</a>
      </div>
    </div>
  </div>
</main>
{{ end }}
