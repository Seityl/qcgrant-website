{{ define "main" }}
<main class="d-flex align-items-center justify-content-center py-5" style="background: linear-gradient(135deg, rgba(8,188,176,0.05) 0%, rgba(66,69,75,0.05) 100%);">
  <div class="container text-center">
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <div class="mb-4">
          <i class="fas fa-exclamation-triangle text-primary" style="font-size: 4rem; opacity: 0.7;"></i>
        </div>
        <h1 class="display-1 fw-bold text-primary mb-3">404</h1>
        <h2 class="mb-4 text-dark">Oops! Page Not Found</h2>
        <p class="lead mb-3 text-muted">The page <code class="bg-light px-2 py-1 rounded" id="attempted-url"></code> you're looking for doesn't exist.</p>
        <p class="mb-4 text-muted">It might have been moved, deleted, or you entered the wrong URL. Don't worry, let's get you back on track!</p>
        <div class="d-flex justify-content-center gap-3 flex-wrap">
          <a href="{{ site.BaseURL | relLangURL }}" class="btn btn-primary btn-lg px-4">
            <i class="fas fa-home me-2"></i>Back to Home
          </a>
          <a href="/contact" class="btn btn-outline-primary btn-lg px-4">
            <i class="fas fa-envelope me-2"></i>Contact Us
          </a>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const attemptedUrl = document.getElementById('attempted-url');
    attemptedUrl.textContent = window.location.pathname + window.location.search;
  });
</script>
{{ end }}
