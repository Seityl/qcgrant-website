#################### default parameters ################################
# favicon
favicon = "images/favicon.png"

# logo
logo = "images/qc-grant-logo-text-wide.webp"
logo_darkmode = "images/qc-grant-logo-text-wide-dark.webp"
logo_width = "200px"
logo_height = "32px"
logo_text = "Q C Grant Ltd."

# OpenGraph / Twitter Card
title = "Q C Grant Ltd. - Cybersecurity & IT Services"
description = "Leading cybersecurity and IT infrastructure provider in the Caribbean. Enterprise-grade security solutions, managed IT services, and cloud/AI integration for SMEs, financial institutions, and government agencies."
author = "Q C Grant Ltd."
image = "images/og-image.png"
email = "support@qcgrant.com"

# SEO Keywords for site-wide use
keywords = ["Caribbean cybersecurity", "IT services Dominica", "managed IT Caribbean", "cybersecurity consulting", "penetration testing", "cloud services Caribbean", "IT security", "HIPAA compliance", "data sovereignty", "ERPNext Caribbean"]

# Social Media
twitter_handle = "qcgrantltd"  # Add actual handle if available

# Theme color for mobile browsers
theme_color = "#08BCB0"

# Image processing toggle: set to false to skip Hugo image processing and use static files
enable_image_processing = true

# Google Analytics
google_analytics = "G-XXXXXXXXXX"  # Replace with actual GA4 ID
# Toggle to enable or disable loading of Google Analytics (gtag) script
enable_google_analytics = false

# Google Search Console verification
google_verification_tag = "your-verification-code-here"  # Replace with actual verification code

# contact info
phone = "+1 767 275 3290"
address = "32 Kennedy Avenue, Roseau, Dominica"

# contact form action (handled by custom API)
contact_form_action = "/api/contact"

# Preloader
[preloader]
  enable = false
  preloader = ""

# Navigation button
[navigation_button]
  enable = true
  label = "Contact Us"
  link = "/contact/"

# cookies
[cookies]
  enable = true
  expire_days = 60
  content = "This site uses cookies to enhance your experience. By continuing to use this website, you agree to their use."
  button = "I Accept"

############################# search ###############################
[search]
  enable = true
  primary_color = "#08BCB0"
  include_sections = ["resources"]
  show_image = true
  show_description = true
  show_tags = true
  show_categories = true